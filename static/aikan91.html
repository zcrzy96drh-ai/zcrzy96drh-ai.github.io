<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>91导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0b10;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    overflow: hidden;
  }

  /* ============ 加载阶段 ============ */
  #loading { position: fixed; inset: 0; }

  /* 上方标题：整屏正中，红色 */
  .title {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: #e8232e;
    font-size: clamp(24px, 5vw, 46px);
    font-weight: 700;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  /* 进度条块：上下约四分之三处（上三下一） */
  .load-block {
    position: absolute;
    left: 50%; top: 75%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: clamp(200px, 44vw, 480px);
  }

  .bar {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }

  /* 填充条与「片」共用同一套彩虹渐变，作为揭晓的预告 */
  .fill {
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, #ff4d4d, #ffb84d, #ffe94d, #4dff88, #4dd2ff, #a64dff, #ff4d4d);
    background-size: 300% 100%;
    animation: load 4s linear forwards, flow 1.6s linear infinite;
  }

  @keyframes load { from { width: 0; } to { width: 100%; } }
  @keyframes flow { from { background-position: 0% 0; } to { background-position: 300% 0; } }

  .hint {
    color: #9aa0aa;
    font-size: clamp(12px, 1.6vw, 15px);
    letter-spacing: .12em;
  }

  /* ============ 揭晓阶段 ============ */
  #reveal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  #reveal.show {
    opacity: 1;
    visibility: visible;
    transition: opacity .5s ease;
  }

  /* 巨大的「片」：尽可能占满屏幕短边，实时彩虹流动 */
  .pian {
    font-size: min(95vmin, 95vw);
    line-height: 1;
    font-weight: 900;
    user-select: none;
    background: linear-gradient(90deg, #ff3b3b, #ff9f2e, #ffe93b, #3bff6e, #2ec9ff, #7a4dff, #ff3bb0, #ff3b3b);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: flow 4s linear infinite;
  }

  /* 弱化动态偏好：保留进度推进与内容切换，去掉循环流动 */
  @media (prefers-reduced-motion: reduce) {
    .fill { animation: load 4s linear forwards; }
    .pian { animation: none; }
  }
</style>
</head>
<body>

  <div id="loading">
    <h1 class="title">永久网址91kan.cn</h1>
    <div class="load-block">
      <div class="bar"><div class="fill"></div></div>
      <p class="hint">请稍后，正在加载中。。。</p>
    </div>
  </div>

  <div id="reveal" aria-hidden="true">
    <span class="pian">片</span>
  </div>

  <script>
    setTimeout(function () {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('reveal').classList.add('show');
    }, 4000);
  </script>

</body>
</html>
