<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f5f2">
<title>点名器</title>
<style>
  :root {
    --bg: #f6f5f2;
    --ink: #1b1c1e;
    --muted: #918f88;
    --faint: #a5a39b;
    --line: #e7e5e0;
    --accent: #2f5d8c;
    --track: #dcdad4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(40px, 9vh, 96px);
    padding: clamp(24px, 5vh, 64px) clamp(20px, 6vw, 80px);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .name {
    max-width: 100%;
    font-size: clamp(56px, 17vmin, 240px);
    font-weight: 600;
    line-height: 1.22;
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--ink);
    transition: color 0.18s ease;
  }

  .name.is-placeholder { color: var(--muted); }
  .is-rolling .name { color: #57554e; }

  @keyframes settle {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .name.settle { animation: settle 0.4s ease-out; }

  .main-btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    min-width: clamp(220px, 30vw, 360px);
    padding: clamp(16px, 2.6vh, 26px) clamp(40px, 7vw, 96px);
    border-radius: clamp(14px, 2.2vmin, 20px);
    background: var(--ink);
    color: #fbfaf8;
    font-family: inherit;
    font-size: clamp(22px, 3.6vmin, 34px);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    transition: background-color 0.18s ease, transform 0.08s ease;
  }
  .main-btn:active { transform: scale(0.97); }
  .main-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .is-rolling .main-btn { background: var(--accent); }

  .repeat {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.6vmin, 24px);
    font-size: clamp(16px, 2.6vmin, 21px);
    letter-spacing: 0.05em;
    color: #57554e;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .switch {
    --sw-w: clamp(60px, 9vmin, 88px);
    --sw-h: clamp(32px, 4.8vmin, 48px);
    --sw-p: clamp(3px, 0.5vmin, 5px);
    position: relative;
    flex: none;
    width: var(--sw-w);
    height: var(--sw-h);
    border-radius: 999px;
    background: var(--track);
    transition: background-color 0.18s ease;
  }
  .switch.on { background: var(--accent); }
  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .knob {
    position: absolute;
    top: var(--sw-p);
    left: var(--sw-p);
    width: calc(var(--sw-h) - var(--sw-p) * 2);
    height: calc(var(--sw-h) - var(--sw-p) * 2);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .switch input:checked + .knob { transform: translateX(calc(var(--sw-w) - var(--sw-h))); }
  .switch input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }

  .footer {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: clamp(12px, 2.4vh, 22px) clamp(20px, 6vw, 80px);
    padding-bottom: calc(clamp(12px, 2.4vh, 22px) + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    font-size: clamp(12px, 1.9vmin, 15px);
    letter-spacing: 0.05em;
    color: var(--faint);
  }
  .footer a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(0, 0, 0, 0.18);
    text-underline-offset: 3px;
    transition: color 0.15s ease;
  }
  .footer a:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="name is-placeholder" id="name">准备开始</p>
  <button class="main-btn" id="toggleBtn" type="button">开始</button>
  <label class="repeat">
    <span>允许重复点名</span>
    <span class="switch" id="repeatSwitch">
      <input type="checkbox" id="repeatToggle" checked>
      <span class="knob"></span>
    </span>
  </label>
</main>
<footer class="footer">©2026<a href="https://weidai.me" target="_blank" rel="noopener noreferrer">杜林峰</a></footer>
<script>
(function () {
  'use strict';

  var NAMES = [
    '陈悠悠', '董博文', '范梦琪', '冯昱霖',
    '古芯瑶', '管晨萱', '郭斐语', '冷昕芮',
    '李静怡', '李俊瑶', '李清如', '刘辰昕',
    '刘韫熙', '罗苏晨', '潘昱天', '钱欣怡',
    '强梓涵', '王梦琪', '王奕晨', '徐皓然',
    '俞垠', '张妍', '郑逸菲', '陈之滕',
    '陈智臨', '杜林峰', '戈柏念', '葛田丰',
    '韩钰韬', '胡辰瑞', '金睿熙', '居家辉',
    '李天颂', '马博文', '马睿', '欧阳泽屹',
    '薛涵', '薛嘉印', '鄢明睿', '晏韵淇',
    '姚宗岐', '张亦弛', '张子涵', '周逸帆',
    '朱宸轩', '朱淳昊', '朱黄梓', '朱文渊',
    '祝浩宁'
  ];

  var STORAGE_KEY = 'dianming.allowRepeat';
  var ROLL_INTERVAL_MS = 55;

  var nameEl = document.getElementById('name');
  var btn = document.getElementById('toggleBtn');
  var repeatInput = document.getElementById('repeatToggle');
  var switchEl = document.getElementById('repeatSwitch');

  var state = 'idle';              // 'idle' | 'rolling'，状态机防连点
  var timer = null;
  var remaining = NAMES.slice();   // 不重复模式下本轮尚未点到的名单（不持久化）

  function syncSwitch() {
    switchEl.classList.toggle('on', repeatInput.checked);
  }

  // 恢复上次开关状态
  try {
    if (localStorage.getItem(STORAGE_KEY) === '0') repeatInput.checked = false;
  } catch (e) { /* 隐私模式等场景下忽略 */ }
  syncSwitch();

  function pool() {
    if (repeatInput.checked) return NAMES;
    if (remaining.length === 0) remaining = NAMES.slice(); // 本轮点完，自动进入下一轮
    return remaining;
  }

  function rollOnce() {
    var list = pool();
    nameEl.textContent = list[Math.floor(Math.random() * list.length)];
  }

  function start() {
    if (state !== 'idle') return;
    state = 'rolling';
    document.body.classList.add('is-rolling');
    nameEl.classList.remove('is-placeholder');
    btn.textContent = '结束';
    rollOnce();
    timer = setInterval(rollOnce, ROLL_INTERVAL_MS);
  }

  function stop() {
    if (state !== 'rolling') return;
    state = 'idle';
    clearInterval(timer);
    timer = null;
    document.body.classList.remove('is-rolling');
    if (!repeatInput.checked) {
      var i = remaining.indexOf(nameEl.textContent);
      if (i > -1) remaining.splice(i, 1);
    }
    btn.textContent = '开始';
    nameEl.classList.remove('settle');
    void nameEl.offsetWidth; // 重置动画，确保每次定格都会播放
    nameEl.classList.add('settle');
  }

  btn.addEventListener('click', function () {
    if (state === 'idle') start();
    else stop();
  });

  repeatInput.addEventListener('change', function () {
    remaining = NAMES.slice(); // 切换开关即重置本轮记录
    syncSwitch();
    try {
      localStorage.setItem(STORAGE_KEY, repeatInput.checked ? '1' : '0');
    } catch (e) { /* 忽略 */ }
  });

  // Service Worker 注册失败不影响点名功能
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
