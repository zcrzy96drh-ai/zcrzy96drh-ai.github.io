<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理 · 大胃袋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#333}
.header{background:#1e1e1e;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:500}
.logout-btn{background:transparent;color:#ccc;border:1px solid #555;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.logout-btn:hover{color:#fff;border-color:#888}
.container{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.card h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:.15s}
.btn-primary{background:#1e1e1e;color:#fff}
.btn-primary:hover{background:#000}
.btn-delete{background:#fff;color:#e74c3c;border:1px solid #e74c3c}
.btn-delete:hover{background:#e74c3c;color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-ghost{padding:5px 12px;font-size:12px;background:transparent;border:1px solid #ddd}
.btn-ghost:hover{border-color:#999}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 8px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px}
th{font-weight:600;color:#666;font-size:12px;text-transform:uppercase}
.form-group{margin-bottom:14px}
label{display:block;margin-bottom:5px;font-weight:600;font-size:13px;color:#555}
input,textarea{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:#1e1e1e}
textarea{min-height:280px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.6;resize:vertical}
.login-box{max-width:400px;margin:80px auto}
.login-box input{margin-bottom:10px}
.status{font-size:12px;color:#888;margin-top:6px}
.draft-indicator{font-size:11px;color:#f0ad4e;margin-left:8px}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:8px;background:#fff;border:1px solid #ddd;cursor:pointer;font-size:13px;font-weight:500}
.tab.active{background:#1e1e1e;color:#fff;border-color:#1e1e1e}
.tab:hover:not(.active){border-color:#999}
.hidden{display:none!important}
.split-view{display:flex;gap:16px;margin-top:12px}
.split-view .preview-box{flex:1;min-height:320px;max-height:70vh;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:16px;font-size:14px;line-height:1.8;color:#333}
.split-view .preview-box h1,.split-view .preview-box h2,.split-view .preview-box h3{margin:16px 0 8px}
.split-view .preview-box p{margin:8px 0}
.split-view .preview-box img{max-width:100%;border-radius:4px}
.split-view .preview-box code{background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:13px}
.split-view .preview-box pre{background:#1e1e1e;color:#e0e0e0;padding:14px;border-radius:6px;overflow-x:auto;margin:10px 0}
.split-view .preview-box pre code{background:transparent;color:inherit;padding:0}
.split-view .preview-box blockquote{border-left:3px solid #1e1e1e;padding-left:12px;color:#666;margin:10px 0}
.split-view .preview-box hr{border:none;border-top:1px solid #eee;margin:16px 0}
.lang-tag{font-size:11px;padding:2px 8px;border-radius:4px;background:#eee}
@media(max-width:768px){
  .split-view{flex-direction:column}
  .split-view .preview-box{height:auto;min-height:200px}
  td,th{padding:8px 4px;font-size:12px}
  .tab{padding:8px 14px;font-size:12px}
}
</style>
</head>
<body>

<div id="login-panel" class="login-box card">
  <h2 style="margin-bottom:14px">🔑 登录后台</h2>
  <p style="font-size:13px;color:#666;margin-bottom:14px">
    输入你的 GitHub Token 登录。<br>
    <a href="https://github.com/settings/tokens" target="_blank" style="color:#1e1e1e">创建一个 Token →</a>（勾选 <b>repo</b>）
  </p>
  <div class="form-group"><label>GitHub Token</label><input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx"></div>
  <button class="btn btn-primary" onclick="login()" style="width:100%">登录</button>
  <div id="login-status" class="status"></div>
</div>

<div id="main-panel" class="hidden">
  <div class="header">
    <h1>📝 内容管理</h1>
    <button class="logout-btn" onclick="logout()">退出</button>
  </div>
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-tab="posts" onclick="switchTab('posts')">✍️ 文章</button>
      <button class="tab" data-tab="projects" onclick="switchTab('projects')">🚀 项目</button>
      <button class="tab" data-tab="about" onclick="switchTab('about')">👤 介绍</button>
      <span style="margin-left:8px">|</span>
      <span class="lang-tag" style="font-size:12px;color:#888;align-self:center" id="lang-indicator">中文</span>
      <button class="btn btn-ghost" onclick="toggleLang()">EN ↔ 中</button>
    </div>

    <div id="list-panel">
      <div class="card">
        <h2><span id="list-title">文章列表</span><button class="btn btn-primary btn-sm" onclick="newItem()">+ 新建</button></h2>
        <table><thead><tr id="list-header"></tr></thead><tbody id="list-body"></tbody></table>
        <div id="list-empty" class="status hidden">暂无内容，点击右上角新建</div>
      </div>
    </div>

    <div id="edit-panel" class="hidden card">
      <h2>
        <span id="edit-title">编辑</span>
        <span id="draft-indicator" class="draft-indicator hidden">📝 已恢复草稿</span>
        <div>
          <button class="btn btn-ghost" onclick="togglePreview()" style="margin-right:8px" id="preview-btn">👁 预览</button>
          <button class="btn btn-ghost" onclick="cancelEdit()" style="margin-right:8px">取消</button>
          <button class="btn btn-primary btn-sm" id="save-btn" onclick="saveItem()">💾 保存</button>
          <button class="btn btn-ghost btn-sm" id="draft-btn" onclick="saveDraft()">📝 存草稿</button>
        </div>
      </h2>
      <div id="edit-fields"></div>
      <div id="preview-container" class="split-view hidden">
        <div><div class="preview-box" id="preview-content" style="background:#fafbfc"></div></div>
      </div>
      <div id="edit-status" class="status"></div>
      <div id="upload-area" style="margin-top:12px;padding-top:12px;border-top:1px solid #eee">
        <span style="font-size:13px;color:#666;margin-right:8px">📎 上传文件</span>
        <input type="file" id="file-upload" accept="image/*,.pdf,.zip,.rar,.7z,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.mp3,.mp4,.mov,.txt,.csv,.json" style="display:none" onchange="uploadFile()">
        <button class="btn btn-ghost" onclick="document.getElementById('file-upload').click()">选择文件</button>
        <span id="upload-status" style="font-size:12px;color:#888;margin-left:8px"></span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>
<script>
const REPO = 'zcrzy96drh-ai/zcrzy96drh-ai.github.io';
let token='', currentTab='posts', currentLang='zh', currentFile='', items=[], previewOn=false;
let draftTimer=null, previewBound=false;

// HTML sanitizer using DOM parser (handles entities, unquoted attrs)
function sanitizeHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.body.querySelectorAll('*').forEach(el=>{
    for(const a of[...el.attributes]){
      if(/^on\w+/i.test(a.name)) el.removeAttribute(a.name);
      if(a.name==='href'&&/^\s*javascript/i.test(a.value)) a.value='blocked:';
    }
  });
  doc.body.querySelectorAll('script,noscript,iframe,object,embed').forEach(e=>e.remove());
  return doc.body.innerHTML;
}

// UTF-8 Base64
function utf8ToBase64(s){const b=new TextEncoder().encode(s);let a='';b.forEach(x=>a+=String.fromCharCode(x));return btoa(a)}
function base64ToUtf8(s){const r=atob(s),u=new Uint8Array([...r].map(c=>c.charCodeAt(0)));return new TextDecoder().decode(u)}

// Escape YAML value
function yamlVal(v){
  if(typeof v==='boolean') return v?'true':'false';
  v=String(v||'').replace(/\\/g,'\\\\');
  if(v.includes('"')||v.includes(':')||v.includes('#')||v.includes("'")) return '"'+v.replace(/"/g,'\\"')+'"';
  return '"'+v+'"';
}

// YAML frontmatter parser — indent-aware with proper nesting
function parseYaml(text){
  const root={};
  if(!text) return root;
  const lines=text.split('\n');
  let stack=[{key:'',obj:root,indent:0}];
  for(let li=0; li<lines.length; li++){
    const l=lines[li];
    if(!l.trim()) continue;
    const indent=l.match(/^(\s*)/)[1].length;
    // Pop back to parent level (treat list-item objects as their own level)
    while(stack.length>1 && indent<=stack[stack.length-1].indent){
      // If popping a list item, also check if we need to pop the list itself
      const popped=stack.pop();
      // If the new top is the list array and indent == list indent, pop that too (sibling list item)
      while(stack.length>1 && Array.isArray(stack[stack.length-1].obj) && indent<=stack[stack.length-1].indent) stack.pop();
    }
    const top=stack[stack.length-1];
    // List item: "- key: value"
    const lm=l.match(/^(\s*)-\s+(\w[\w-]*):\s*(.*)/);
    if(lm){
      const k=lm[2], v=lm[3].replace(/^"(.*)"$/,'$1').replace(/^'(.*)'$/,'$1').trim();
      // Find the list array — it's either top.obj or a value in top.obj
      let arr=top.obj;
      if(!Array.isArray(arr)){
        for(let[kv,vv]of Object.entries(top.obj)){if(Array.isArray(vv)){arr=vv;break}}
      }
      if(!Array.isArray(arr)){arr=[];/* guard: shouldn't happen */}
      let item=arr[arr.length-1];
      if(!item||arr.length===0||k==='title'){item={};arr.push(item)}
      item[k]=v;
      // Push this item object as a new stack level so deeper keys route to it
      stack.push({key:k,obj:item,indent});
      continue;
    }
    // Regular key:value
    const m=l.match(/^(\s*)(\w[\w-]*):\s*(.*)/);
    if(!m) continue;
    const key=m[2], val=m[3].replace(/^"(.*)"$/,'$1').replace(/^'(.*)'$/,'$1').trim();
    // Only apply peek-ahead (nested object/list detection) at the SAME indent as parent.
    // Deeper keys are always leaf values of the current object.
    if(indent<=top.indent){
      // Find next non-blank line
      let ni=li+1;
      while(ni<lines.length && !lines[ni].trim()) ni++;
      const next=ni<lines.length?lines[ni]:'';
      const nextIndent=next.match(/^(\s*)/)?.[1]?.length||0;
      if(nextIndent>indent && !next.match(/^\s*-/)){
        top.obj[key]={};
        stack.push({key,obj:top.obj[key],indent});
        continue;
      }
      if(next.match(/^\s*-/) && nextIndent>indent){
        top.obj[key]=[];
        stack.push({key,obj:top.obj[key],indent});
        continue;
      }
    }
    top.obj[key]=val;
  }
  return root;
}

// YAML frontmatter builder
function buildYaml(fields){
  let y='---\n';
  for(let[k,v]of Object.entries(fields)){
    if(v===null||v===undefined||v==='') continue;
    if(typeof v==='object'&&!Array.isArray(v)){
      y+=`${k}:\n`;
      for(let[sk,sv]of Object.entries(v)){if(sv) y+=`  ${sk}: ${yamlVal(sv)}\n`}
    }else if(Array.isArray(v)){
      if(v.length) y+=`${k}: [${v.map(x=>'"'+x+'"').join(', ')}]\n`;
    }else{
      y+=`${k}: ${yamlVal(v)}\n`;
    }
  }
  y+='---\n\n';
  return y;
}

// --- Login ---
async function login(){
  token=document.getElementById('token-input').value.trim();
  const s=document.getElementById('login-status');
  if(!token){s.textContent='请输入 Token';return}
  s.textContent='验证中...';
  try{
    const r=await fetch('https://api.github.com/user',{headers:{Authorization:'token '+token}});
    if(!r.ok){s.textContent='Token 无效';return}
    localStorage.setItem('admin_token',token);
    document.getElementById('login-panel').classList.add('hidden');
    document.getElementById('main-panel').classList.remove('hidden');
    loadItems();
  }catch(e){s.textContent='网络错误'}
}
function logout(){localStorage.removeItem('admin_token');location.reload()}
async function api(path,opts={}){opts.headers=opts.headers||{};opts.headers.Authorization='token '+token;return fetch('https://api.github.com'+path,opts)}

// --- Draft auto-save ---
function startDraftSave(){
  clearInterval(draftTimer);
  draftTimer=setInterval(()=>{
    const ta=document.getElementById('f-body'), ti=document.getElementById('f-title');
    if(!ta) return;
    const key=currentFile||'new-'+currentLang+'-'+currentTab;
    localStorage.setItem('draft_'+key,JSON.stringify({title:ti?ti.value:'',body:ta.value,tab:currentTab,lang:currentLang,file:currentFile,time:Date.now()}));
  },3000);
}
function stopDraftSave(){clearInterval(draftTimer)}
function loadDraft(){
  const key=currentFile||'new-'+currentLang+'-'+currentTab;
  const raw=localStorage.getItem('draft_'+key);
  if(!raw) return;
  const d=JSON.parse(raw);
  if(Date.now()-d.time>86400000) return;
  const ti=document.getElementById('f-title');if(ti) ti.value=d.title;
  document.getElementById('f-body').value=d.body;
  document.getElementById('draft-indicator').classList.remove('hidden');
  localStorage.removeItem('draft_'+key);
}

// --- Markdown preview ---
function togglePreview(){
  previewOn=!previewOn;
  const pc=document.getElementById('preview-container'), ta=document.getElementById('f-body');
  const fg=ta?ta.closest('.form-group'):null;
  if(previewOn){pc.classList.remove('hidden');if(fg) fg.classList.add('hidden');if(!previewBound) bindPreview()}
  else{pc.classList.add('hidden');if(fg) fg.classList.remove('hidden')}
  document.getElementById('preview-btn').textContent=previewOn?'📝 编辑':'👁 预览';
}
let _pvHandler=null;
function bindPreview(){
  const ta=document.getElementById('f-body'), div=document.getElementById('preview-content');
  if(!ta||!div) return;
  if(_pvHandler) ta.removeEventListener('input',_pvHandler);
  _pvHandler=()=>{div.innerHTML=sanitizeHTML(marked.parse(ta.value||''))};
  ta.addEventListener('input',_pvHandler);
  div.innerHTML=sanitizeHTML(marked.parse(ta.value||''));
  previewBound=true;
}
function updatePreview(){
  const div=document.getElementById('preview-content'), ta=document.getElementById('f-body');
  if(div&&ta) div.innerHTML=sanitizeHTML(marked.parse(ta.value||''));
}

// --- Language toggle ---
function toggleLang(){
  currentLang=currentLang==='zh'?'en':'zh';
  document.getElementById('lang-indicator').textContent=currentLang==='zh'?'中文':'English';
  cancelEdit();
  loadItems();
}

// --- List/Edit ---
async function loadItems(){
  items=[];stopDraftSave();
  const contentDir=currentLang==='zh'?'content/zh':'content/en';
  const dir=currentTab==='posts'?contentDir+'/posts':currentTab==='projects'?contentDir+'/projects':'';
  if(currentTab==='about'){document.getElementById('list-panel').classList.add('hidden');editAbout();return}
  document.getElementById('list-panel').classList.remove('hidden');
  document.getElementById('list-title').textContent=(currentTab==='posts'?'文章列表':'项目列表')+' ('+(currentLang==='zh'?'中文':'English')+')';
  const r=await api(`/repos/${REPO}/contents/${dir}`);
  if(!r.ok){renderList();return}
  const data=await r.json();
  items=data.filter(f=>f.name.endsWith('.md')&&f.name!=='_index.md').map(f=>({name:f.name.replace('.md',''),path:f.path,sha:f.sha}));
  for(let i of items){
    try{
      const r2=await api(`/repos/${REPO}/contents/${i.path}`);
      if(r2.ok){const d=await r2.json();const c=base64ToUtf8(d.content);const fm=c.match(/^---\n([\s\S]*?)\n---/);if(fm)Object.assign(i,parseYaml(fm[1]));i.sha=d.sha}
    }catch(e){}
  }
  renderList();
}

function renderList(){
  const h=document.getElementById('list-header'),b=document.getElementById('list-body');
  if(currentTab==='posts'){
    h.innerHTML='<th>标题</th><th>日期</th><th>操作</th>';
    b.innerHTML=items.map(i=>`<tr><td><b>${esc(i.title||i.name)}</b>${i.draft==='true'||i.draft===true?' <span style="color:#f0ad4e;font-size:11px">草稿</span>':''}</td><td style="color:#888">${i.date||'-'}</td><td><button class="btn btn-sm" onclick="editItem('${esc(i.path)}')">编辑</button> <button class="btn btn-sm btn-delete" onclick="deleteItem('${esc(i.path)}','${esc(i.sha)}')">删</button></td></tr>`).join('');
  }else{
    h.innerHTML='<th>项目</th><th>日期</th><th>链接</th><th>操作</th>';
    b.innerHTML=items.map(i=>{const lks=Array.isArray(i.links)?i.links.map(x=>x.title||x.url).join(', '):(i.links||'-');return`<tr><td><b>${esc(i.title||i.name)}</b>${i.draft==='true'||i.draft===true?' <span style="color:#f0ad4e;font-size:11px">草稿</span>':''}</td><td style="color:#888">${i.date||'-'}</td><td style="color:#888">${lks}</td><td><button class="btn btn-sm" onclick="editItem('${esc(i.path)}')">编辑</button> <button class="btn btn-sm btn-delete" onclick="deleteItem('${esc(i.path)}','${esc(i.sha)}')">删</button></td></tr>`}).join('');
  }
  document.getElementById('list-empty').classList.toggle('hidden',items.length>0);
}

function newItem(){
  currentFile='';previewOn=false;previewBound=false;
  document.getElementById('preview-container').classList.add('hidden');
  document.getElementById('preview-btn').textContent='👁 预览';
  const df=new Date().toISOString().split('T')[0];
  document.getElementById('draft-btn').classList.remove('hidden');
  document.getElementById('save-btn').textContent='💾 保存';
  if(currentTab==='posts'){
    document.getElementById('edit-title').textContent='新建文章 ('+(currentLang==='zh'?'中文':'English')+')';
    document.getElementById('edit-fields').innerHTML=`
      <div class="form-group"><label>文件名</label><input id="f-slug" placeholder="my-post"></div>
      <div class="form-group"><label>标题</label><input id="f-title"></div>
      <div class="form-group"><label>日期</label><input id="f-date" value="${df}"></div>
      <div class="form-group"><label>简介</label><input id="f-desc"></div>
      <div class="form-group"><label>封面图路径 (可选)</label><input id="f-cover" placeholder="/images/xxx.jpg"></div>
      <div class="form-group"><label>正文 (Markdown)</label><textarea id="f-body"></textarea></div>`;
  }else{
    document.getElementById('edit-title').textContent='新建项目 ('+(currentLang==='zh'?'中文':'English')+')';
    document.getElementById('edit-fields').innerHTML=`
      <div class="form-group"><label>文件名</label><input id="f-slug" placeholder="my-project"></div>
      <div class="form-group"><label>项目名称</label><input id="f-title"></div>
      <div class="form-group"><label>日期</label><input id="f-date" value="${df}"></div>
      <div class="form-group"><label>简介</label><input id="f-desc"></div>
      <div class="form-group"><label>封面图路径</label><input id="f-cover" placeholder="/images/projects/xxx.png"></div>
      <div class="form-group"><label>GitHub 链接</label><input id="f-ghlink"></div>
      <div class="form-group"><label>演示链接</label><input id="f-demolink"></div>
      <div class="form-group"><label>详细介绍</label><textarea id="f-body"></textarea></div>`;
  }
  document.getElementById('draft-indicator').classList.add('hidden');
  document.getElementById('list-panel').classList.add('hidden');
  document.getElementById('edit-panel').classList.remove('hidden');
  loadDraft();startDraftSave();
}

async function editItem(path){
  currentFile=path;previewOn=false;previewBound=false;
  document.getElementById('preview-container').classList.add('hidden');
  document.getElementById('preview-btn').textContent='👁 预览';
  document.getElementById('draft-btn').classList.remove('hidden');
  document.getElementById('save-btn').textContent='💾 保存';
  const r=await api(`/repos/${REPO}/contents/${path}`);
  if(!r.ok){alert('加载文件失败，请刷新重试');return}
  const data=await r.json();window._editSha=data.sha;
  const c=base64ToUtf8(data.content).replace(/\r/g,'');
  const fm=c.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)/);
  const body=fm?fm[2].trim():c;
  const front=fm?parseYaml(fm[1]):{};

  const isPost=path.includes('/posts/');
  document.getElementById('edit-title').textContent=(isPost?'编辑文章':'编辑项目')+' ('+(currentLang==='zh'?'中文':'English')+')';
  const gh=front.links&&Array.isArray(front.links)?front.links.find(l=>l.title==='GitHub'):null;
  const demo=front.links&&Array.isArray(front.links)?front.links.find(l=>l.title==='在线演示'):null;
  const cover=front.cover&&typeof front.cover==='object'?front.cover.image||'':'';
  if(isPost){
    document.getElementById('edit-fields').innerHTML=`
      <div class="form-group"><label>标题</label><input id="f-title" value="${esc(front.title||'')}"></div>
      <div class="form-group"><label>日期</label><input id="f-date" value="${esc(front.date||'')}"></div>
      <div class="form-group"><label>简介</label><input id="f-desc" value="${esc(front.description||'')}"></div>
      <div class="form-group"><label>封面图路径</label><input id="f-cover" value="${esc(cover)}"></div>
      <div class="form-group"><label>正文 (Markdown)</label><textarea id="f-body">${esc(body)}</textarea></div>`;
  }else{
    document.getElementById('edit-fields').innerHTML=`
      <div class="form-group"><label>项目名称</label><input id="f-title" value="${esc(front.title||'')}"></div>
      <div class="form-group"><label>日期</label><input id="f-date" value="${esc(front.date||'')}"></div>
      <div class="form-group"><label>简介</label><input id="f-desc" value="${esc(front.description||'')}"></div>
      <div class="form-group"><label>封面图路径</label><input id="f-cover" value="${esc(cover)}"></div>
      <div class="form-group"><label>GitHub 链接</label><input id="f-ghlink" value="${esc(gh?gh.url:'')}"></div>
      <div class="form-group"><label>演示链接</label><input id="f-demolink" value="${esc(demo?demo.url:'')}"></div>
      <div class="form-group"><label>详细介绍</label><textarea id="f-body">${esc(body)}</textarea></div>`;
  }
  document.getElementById('draft-indicator').classList.add('hidden');
  document.getElementById('list-panel').classList.add('hidden');
  document.getElementById('edit-panel').classList.remove('hidden');
  loadDraft();startDraftSave();
}

async function editAbout(){
  const contentDir=currentLang==='zh'?'content/zh':'content/en';
  currentFile=contentDir+'/about.md';stopDraftSave();
  document.getElementById('draft-btn').classList.add('hidden');
  document.getElementById('save-btn').textContent='💾 保存';
  const r=await api(`/repos/${REPO}/contents/${currentFile}`);
  if(!r.ok){alert('加载文件失败，请刷新重试');return}
  const data=await r.json();window._editSha=data.sha;
  const c=base64ToUtf8(data.content).replace(/\r/g,'');
  const fm=c.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)/);
  const body=fm?fm[2].trim():c;
  document.getElementById('edit-title').textContent='编辑个人介绍 ('+(currentLang==='zh'?'中文':'English')+')';
  document.getElementById('edit-fields').innerHTML=`
    <div class="form-group"><label>标题</label><input id="f-title" value="${fm?esc((fm[1].match(/^title:\s*(.*)/m)||[])[1]||''):''}"></div>
    <div class="form-group"><label>内容 (Markdown)</label><textarea id="f-body">${esc(body)}</textarea></div>`;
  document.getElementById('list-panel').classList.add('hidden');
  document.getElementById('edit-panel').classList.remove('hidden');
  startDraftSave();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// --- File upload ---
function isImage(n){return/\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)$/i.test(n)}
function fileIcon(n){return isImage(n)?'🖼':/\.(mp4|mov)$/i.test(n)?'🎬':/\.(mp3|wav)$/i.test(n)?'🎵':'📄'}
async function uploadFile(){
  const input=document.getElementById('file-upload'),f=input.files[0];
  if(!f) return;
  const status=document.getElementById('upload-status');
  // Block dangerous file types
  const blockedExt=/\.(html?|js|php|asp|jsp|cgi|pl|py|rb|sh|exe|bat|cmd|com|dll|msi|svg)$/i;
  if(blockedExt.test(f.name)){status.textContent='❌ 不允许上传可执行文件或脚本';return}
  if(f.size>100*1024*1024){status.textContent='❌ 不能超过 100MB';return}
  status.textContent='上传中...';
  const reader=new FileReader();
  reader.onload=async function(){
    const b64=reader.result.split(',')[1];
    const fn=Date.now()+'-'+f.name.replace(/[^\w.一-鿿㐀-䶿-]/g,'_');
    const path='static/files/'+fn;
    try{
      const r=await api(`/repos/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify({message:'上传 '+fn,content:b64,branch:'main'})});
      if(r.ok){
        const md=isImage(fn)?`![${fn}](/files/${fn})`:`${fileIcon(fn)} [${f.name}](/files/${fn})`;
        const ta=document.getElementById('f-body');if(ta) ta.value=ta.value+'\n'+md+'\n';
        if(previewOn) updatePreview();
        status.textContent='✅ 已插入';
      }else{const e=await r.json();status.textContent='❌ 保存失败 (HTTP '+r.status+')'}
    }catch(e){status.textContent='网络错误'}
  };
  reader.readAsDataURL(f);
}

// --- Save ---
function collectFields(draft,isPost){
  const get=(id)=>document.getElementById(id);
  const cover=get('f-cover'),gh=get('f-ghlink'),demo=get('f-demolink');
  const fields={
    title:(get('f-title')||{}).value||'Untitled',
    date:(get('f-date')||{}).value||'',
    description:(get('f-desc')||{}).value||''
  };
  fields.draft=draft;
  if(cover&&cover.value) fields.cover={image:cover.value};
  if(!isPost){
    fields._links=[];
    if(gh&&gh.value) fields._links.push({title:'GitHub',url:gh.value});
    if(demo&&demo.value) fields._links.push({title:'在线演示',url:demo.value});
  }
  return fields;
}

async function doSave(isDraft){
  const status=document.getElementById('edit-status');
  status.textContent='保存中...';stopDraftSave();
  const body=document.getElementById('f-body').value;
  // About tab: only title + body, no complex frontmatter
  const isAbout=currentTab==='about';
  const isPost=!isAbout && (currentTab==='posts'||currentFile.includes('/posts/'));

  let fm;
  if(isAbout){
    const t=document.getElementById('f-title').value||'';
    // Preserve original description from frontmatter
    let descLine='';
    if(window._editSha){
      try{
        const orig=await api(`/repos/${REPO}/contents/${currentFile}`);
        if(orig.ok){const d=await orig.json();const c=base64ToUtf8(d.content);const fm=c.match(/^---\n([\s\S]*?)\n---/);if(fm){const p=parseYaml(fm[1]);if(p.description) descLine=`description: ${yamlVal(p.description)}\n`}}
        else status.textContent='⚠️ 无法保留 description，将覆盖';
      }catch(e){status.textContent='⚠️ 无法保留 description，将覆盖'}
    }
    fm=`---\ntitle: ${yamlVal(t)}\n${descLine}---\n\n`;
  }else{
    const fields=collectFields(isDraft,isPost);
    const links=fields._links; delete fields._links;
    fm=buildYaml(fields);
    if(!isPost && links && links.length){
      fm=fm.replace('---\n\n',`links:\n${links.map(l=>`  - title: ${yamlVal(l.title)}\n    url: ${yamlVal(l.url)}`).join('\n')}\n---\n\n`);
    }
  }

  let path=currentFile;
  if(!path){
    const sl=(document.getElementById('f-slug').value||'untitled').slice(0,100);
    const contentDir=currentLang==='zh'?'content/zh':'content/en';
    const dir=isAbout?contentDir:isPost?contentDir+'/posts':contentDir+'/projects';
    path=`${dir}/${sl.replace(/[/\s\\?%*:|"<>]/g,'-')}.md`;
  }

  const content=utf8ToBase64(fm+body);
  const payload={message:'更新 '+path,content:content,branch:'main'};
  if(window._editSha) payload.sha=window._editSha;

  try{
    const r=await api(`/repos/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify(payload)});
    if(r.ok){
      status.textContent='✅ 保存成功！';
      const key=currentFile||'new-'+currentLang+'-'+currentTab;
      localStorage.removeItem('draft_'+key);
      setTimeout(()=>{cancelEdit();loadItems()},1500);
    }else{const e=await r.json();status.textContent='❌ 保存失败 (HTTP '+r.status+')'}
  }catch(e){status.textContent='网络错误'}
}
function saveItem(){doSave(false)}
function saveDraft(){doSave(true)}

async function deleteItem(path,sha){
  if(!sha){alert('无法获取文件标识，请刷新重试');return}
  if(!confirm('确定删除 '+path+'？')) return;
  try{
    const r=await api(`/repos/${REPO}/contents/${path}`,{method:'DELETE',body:JSON.stringify({message:'删除 '+path,sha:sha,branch:'main'})});
    if(r.ok) loadItems();else{alert('删除失败 (HTTP '+r.status+')')}
  }catch(e){alert('网络错误')}
}

function cancelEdit(){stopDraftSave();document.getElementById('edit-panel').classList.add('hidden');document.getElementById('list-panel').classList.remove('hidden');window._editSha=null}

function switchTab(tab,lang){
  currentTab=tab;if(lang) currentLang=lang;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab&&!t.classList.contains('lang-tab')));
  cancelEdit();loadItems();
}

// Init — validate stored token on load
(async function init(){
  const saved=localStorage.getItem('admin_token');
  if(!saved) return;
  token=saved;
  try{
    const r=await fetch('https://api.github.com/user',{headers:{Authorization:'token '+token}});
    if(!r.ok){localStorage.removeItem('admin_token');return}
    document.getElementById('login-panel').classList.add('hidden');
    document.getElementById('main-panel').classList.remove('hidden');
    loadItems();
  }catch(e){/* network error, keep token and try */}
})();

// Save draft on page close
window.addEventListener('beforeunload',()=>{
  const ta=document.getElementById('f-body'),ti=document.getElementById('f-title');
  if(!ta||!ta.value) return;
  const key=currentFile||'new-'+currentLang+'-'+currentTab;
  localStorage.setItem('draft_'+key,JSON.stringify({title:ti?ti.value:'',body:ta.value,tab:currentTab,lang:currentLang,file:currentFile,time:Date.now()}));
});
</script>
