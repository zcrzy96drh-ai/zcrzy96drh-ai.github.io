<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>开学倒计时</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#faf9f7;
  color:#3d3d3d;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
  min-height:100dvh;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  position:relative;
}
.hidden{display:none}

/* ============ 简约背景 ============ */
.bg{
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg, #faf9f7 0%, #f2f0ec 100%);
}

/* ============ 通用卡片 ============ */
.card-base{
  background:#ffffff;
  border-radius:20px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}

/* ============ 开启界面（信封页）============ */
#envelope-screen{perspective:1200px}
.env-wrap{
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .3s ease;
}
.env-wrap:active{transform:scale(.98)}

/* 头像 */
.env-avatar-wrap{
  position:relative;z-index:3;
  margin-bottom:-38px;
  border-radius:50%;
  background:#ffffff;
  padding:4px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.env-avatar{
  width:84px;height:84px;border-radius:50%;
  object-fit:cover;
  display:block;
  transform-origin:50% 100%;
  transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .35s ease;
}

/* 信封主体 */
.env-body{
  position:relative;z-index:2;
  width:min(300px,86vw);
  padding:54px 28px 36px;
  border-radius:22px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transform-origin:50% 0%;
  transition:transform .55s cubic-bezier(.4,0,.2,1) .1s;
  overflow:hidden;
}
/* 信封封口 */
.env-body::before{
  content:'';position:absolute;top:0;left:0;right:0;height:68px;
  background:#f5f0e6;
  clip-path:polygon(0 0, 50% 100%, 100% 0);
  border-bottom:1px solid rgba(0,0,0,.04);
}
.env-to{
  font-size:15px;color:#888888;letter-spacing:.5px;
  position:relative;z-index:1;
}
.env-title{
  font-size:22px;color:#2c2c2c;font-weight:700;letter-spacing:1px;
  position:relative;z-index:1;
}
.env-hint{
  margin-top:12px;font-size:13px;color:#aaaaaa;
  position:relative;z-index:1;
}

/* 打开按钮 */
.open-btn-wrap{margin-top:40px}
.open-btn{
  width:60px;height:60px;border:none;border-radius:50%;
  background:#2c2c2c;color:#ffffff;
  font-size:17px;font-weight:600;letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.12);
  transition:transform .2s ease, background .2s ease;
}
.open-btn:active{transform:scale(.94);background:#000000}

/* 开启动画 */
.env-wrap.opening .env-avatar{transform:translateY(-16px) rotateX(160deg);opacity:0}
.env-wrap.opening .env-body{transform:rotateX(108deg);opacity:.85}
#envelope-screen.fade-out{opacity:0;transform:translateY(-16px);transition:opacity .4s ease, transform .4s ease}
#main-screen.fade-in{animation:mainIn .6s cubic-bezier(.22,1,.36,1)}
@keyframes mainIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============ 倒计时主界面 ============ */
.avatar-wrap{
  position:relative;
  margin-bottom:26px;
  padding:4px;
  border-radius:24%;
  background:#ffffff;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.avatar{
  width:min(130px,36vw);
  height:min(130px,36vw);   /* 高度兜底：老浏览器不支持 aspect-ratio 时仍为正方形 */
  aspect-ratio:1;
  border-radius:22%;
  object-fit:cover;
  display:block;
}

.school{
  color:#2c2c2c;font-weight:700;
  font-size:clamp(20px,6vw,24px);
  text-align:center;
  margin-bottom:6px;
}
.sub{
  color:#888888;font-size:16px;
  text-align:center;margin-bottom:34px;
}

/* 倒计时卡片 */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:min(12px,3vw);
  width:100%;max-width:400px;
}
.card{
  aspect-ratio:.8;
  min-height:84px;   /* 兜底：老浏览器不支持 aspect-ratio 时保底高度 */
  border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 4px;
}
.unit{font-size:13px;color:#999999;font-weight:500}
.num{
  font-size:clamp(30px,9vw,40px);font-weight:700;color:#2c2c2c;
  font-variant-numeric:tabular-nums;line-height:1;
}
/* 翻牌动画 */
.num.flipping{animation:flipY .5s cubic-bezier(.4,0,.2,1)}
@keyframes flipY{
  0%{transform:rotateY(0)}
  50%{transform:rotateY(90deg)}
  100%{transform:rotateY(0)}
}

/* 小屏微调 */
@media (max-width:360px){
  .env-body{width:min(280px,90vw);padding:50px 22px 32px}
  .env-title{font-size:20px}
  .cards{gap:8px}
  .card{border-radius:15px}
  .num{font-size:26px}
  .unit{font-size:12px}
}

/* 减弱动画偏好：系统开启"减少动态效果"时禁用动画 */
@media (prefers-reduced-motion: reduce){
  .env-avatar,.env-body,.open-btn,#envelope-screen,#main-screen,.num{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- ============ 开启界面（信封页）============ -->
<div id="envelope-screen" class="screen">
  <div class="env-wrap" id="env-wrap">
    <!-- ★★★ 头像图片：替换同目录下的 avatar.jpg 即可（信封页与倒计时主界面共用同一张，共 2 处使用）★★★ -->
    <div class="env-avatar-wrap">
      <img class="env-avatar" src="avatar.jpg" alt="头像" onerror="this.style.display='none'">
    </div>
    <div class="env-body card-base">
      <!-- ★★★ 姓名在这里改：把"汪梓涵"替换成其他名字即可（共 1 处）★★★ -->
      <p class="env-to">To：汪梓涵</p>
      <p class="env-title">我有一封信给你</p>
      <p class="env-hint">点击开启</p>
    </div>
  </div>
  <div class="open-btn-wrap">
    <button class="open-btn" id="open-btn">开启</button>
  </div>
</div>

<!-- ============ 倒计时主界面 ============ -->
<div id="main-screen" class="screen hidden">
  <!-- ★★★ 头像路径：avatar.jpg（与页面同目录；信封页共用同一张，替换文件即可，路径不用改）★★★ -->
  <div class="avatar-wrap">
    <img class="avatar" src="avatar.jpg" alt="头像" onerror="this.style.display='none'">
  </div>
  <p class="school">苏州高新区实验初级中学提醒你</p>
  <p class="sub" id="sub">距离暑假结束还有</p>
  <div class="cards" role="timer" aria-live="polite" aria-atomic="false">
    <div class="card card-base"><span class="unit">年</span><span class="num" id="num-y">00</span></div>
    <div class="card card-base"><span class="unit">月</span><span class="num" id="num-m">00</span></div>
    <div class="card card-base"><span class="unit">天</span><span class="num" id="num-d">00</span></div>
    <div class="card card-base"><span class="unit">小时</span><span class="num" id="num-h">00</span></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============ 可替换配置 ============ */
  // ★★★ 开学时间在这里改：new Date(2026, 8, 1, 0, 0, 0) = 2026年9月1日 00:00:00
  //     注意 JS 月份从 0 开始，8 代表 9 月 ★★★
  var TARGET = new Date(2026, 8, 1, 0, 0, 0);
  // ★★★ 姓名见上方 HTML 注释（信封文字"To：汪梓涵"处）★★★
  // ★★★ 头像路径见上方 HTML 注释（avatar.jpg）★★★

  var envScreen = document.getElementById('envelope-screen');
  var mainScreen = document.getElementById('main-screen');
  var envWrap   = document.getElementById('env-wrap');
  var openBtn   = document.getElementById('open-btn');
  var sub       = document.getElementById('sub');
  /* 缓存数字元素引用，避免每秒重复查询 DOM */
  var nums = {
    y: document.getElementById('num-y'),
    m: document.getElementById('num-m'),
    d: document.getElementById('num-d'),
    h: document.getElementById('num-h')
  };
  var opening = false;
  var timer = null;
  var last = {y:null, m:null, d:null, h:null};

  function pad(n){ return String(n).padStart(2, '0'); }

  /* 计算剩余 年/月/天/小时 */
  function calc(){
    var now = new Date();
    if (now >= TARGET) return {done:true, y:0, m:0, d:0, h:0};
    var y = TARGET.getFullYear() - now.getFullYear();
    var m = (TARGET.getFullYear() - now.getFullYear()) * 12 + (TARGET.getMonth() - now.getMonth());
    var base = new Date(now.getFullYear(), now.getMonth() + m, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    /* while 而非 if：月末边界（如 1月31日 目标 3月1日）回退一个月后可能仍大于目标，
       例如 2月31日 会被 JS 进位成 3月3日，需要继续回退直到不越界 */
    while (base > TARGET) { m--; base = new Date(now.getFullYear(), now.getMonth() + m, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds()); }
    var rest = TARGET - base;
    var d = Math.floor(rest / 86400000);
    var h = Math.floor((rest - d * 86400000) / 3600000);
    return {done:false, y:y, m:m, d:d, h:h};
  }

  /* 翻牌动画 */
  function flip(key, val, delay){
    setTimeout(function(){
      var el = nums[key];
      if (el.textContent === val) return;
      el.classList.add('flipping');
      setTimeout(function(){ el.textContent = val; }, 250);
      setTimeout(function(){ el.classList.remove('flipping'); }, 500);
    }, delay);
  }

  /* 倒计时结束 */
  function finish(){
    clearInterval(timer); timer = null;
    ['y','m','d','h'].forEach(function(k){
      nums[k].textContent = '00';
    });
    sub.textContent = '暑假已结束，新学期开始';
  }

  /* 每秒检查 */
  function tick(){
    var r = calc();
    if (r.done) { finish(); return; }
    var vals = {y:pad(r.y), m:pad(r.m), d:pad(r.d), h:pad(r.h)};
    var delay = 0;
    ['h','d','m','y'].forEach(function(k){
      if (last[k] !== null && vals[k] !== last[k]) {
        flip(k, vals[k], delay);
        delay += 100;
      }
    });
    last = vals;
  }

  function startCountdown(){
    var r = calc();
    if (r.done) { finish(); return; }
    last = {y:pad(r.y), m:pad(r.m), d:pad(r.d), h:pad(r.h)};
    ['y','m','d','h'].forEach(function(k){
      nums[k].textContent = last[k];
    });
    timer = setInterval(tick, 1000);
  }

  /* 开启动画 */
  function open(){
    if (opening) return;
    opening = true;
    envWrap.classList.add('opening');
    setTimeout(function(){ envScreen.classList.add('fade-out'); }, 360);
    setTimeout(function(){
      envScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      mainScreen.classList.add('fade-in');
      startCountdown();
    }, 760);
  }

  openBtn.addEventListener('click', open);
  envWrap.addEventListener('click', open);

  /* 手机休眠唤醒后立即校正一次（后台 setInterval 会被节流） */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && timer) tick();
  });
})();
</script>
</body>
</html>
